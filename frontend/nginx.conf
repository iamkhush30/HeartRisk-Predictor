server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS. Re-resolves the backend name so a replaced
    # backend container is found again without restarting nginx.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend http://ml-container:5000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri /index.html;
    }
}
